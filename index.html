<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MPL STORE - Official Merchandise</title>
    <script>
      // Prevent polyfills or injected scripts from crashing if window.fetch is a getter-only property.
      (function() {
        try {
          var _fetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() { return _fetch; },
            set: function(v) { _fetch = v; }
          });
        } catch (e) {
          // If it fails, at least attempt to set it on self
          try { self.fetch = window.fetch; } catch(i) {}
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

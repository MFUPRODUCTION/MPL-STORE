<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MPL STORE - Official Merchandise</title>
  </head>
  <body>
    <div id="root">
      <div style="background-color: #050505; color: white; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: sans-serif;">
        Loading MPL Store...
      </div>
    </div>
    <script>
      // Final attempt at robust fetch patch
      (function() {
        try {
          var originalFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            value: originalFetch,
            writable: true,
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn("Could not patch fetch:", e);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
